# Caddy: HTTPS for pokemonkarten.at, www redirect and staging.
# Start once on the vServer:
#   docker network create pokeshop-edge
#   docker compose -f infra/caddy/compose.yaml --env-file infra/caddy/.env up -d

name: pokeshop-edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
    name: pokeshop-edge
