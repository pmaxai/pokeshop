name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokeshop
          POSTGRES_PASSWORD: pokeshop
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pokeshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: pokeshop
      PGPASSWORD: pokeshop
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check core and worker
        run: pnpm typecheck
      - name: Unit tests (shop rules)
        run: pnpm test:core
      - name: Database tests (migrations, stock, reservation race)
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          pnpm test:db
      - name: Integration tests (products, API keys, jobs, images, card data)
        run: pnpm test:integration
      - name: Build the web app (includes its type-check)
        run: pnpm build

  image:
    # Builds the Docker image on every run and smoke-tests it against PostgreSQL.
    # Pushes to GHCR only for main and tags: every image as :sha-<commit>, and main also as
    # :staging. :production moves only through the "Promote to production" workflow.
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokeshop
          POSTGRES_PASSWORD: pokeshop
          POSTGRES_DB: pokeshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pokeshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          load: true
          tags: pokeshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrate, web health, worker start)
        run: |
          ENV="-e DATABASE_URL=postgres://pokeshop:pokeshop@localhost:5432/pokeshop -e DATABASE_SSL=disable -e API_KEY_MASTER_KEY=$(openssl rand -base64 32) -e PUBLIC_BASE_URL=http://localhost:3000"
          docker run --rm --network host $ENV pokeshop:ci node packages/core/scripts/migrate.ts
          docker run -d --name web --network host $ENV pokeshop:ci
          docker run -d --name worker --network host $ENV pokeshop:ci node apps/worker/src/main.ts
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          check() {
            code=$(curl -s -o /tmp/page -w '%{http_code}' "http://localhost:3000$1")
            echo "$1 -> $code"
            if [ "$code" != 200 ]; then head -c 2000 /tmp/page; echo; return 1; fi
          }
          check /api/health
          check /
          check /de
          check /cards
          check /de/karten
          check /shipping-and-payment
          check /de/versand-und-zahlung
          check /cart
          check /terms
          check /de/agb
          check /withdraw
          check /de/veranstaltungen
          check /admin/login
          check '/og.png?l=de'
          curl -s http://localhost:3000/de/agb | grep -q 'Allgemeine Geschäftsbedingungen' || { echo 'legal texts not loaded'; exit 1; }
          # German pages used to sit at the root: old links redirect to /de
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/karten)" = '308 http://localhost:3000/de/karten' || { echo 'old German link not redirected'; exit 1; }
          docker run --rm --network host $ENV pokeshop:ci node apps/worker/src/cli.ts api-client list
          # the worker starts the card-data sync on the empty database; it must stay healthy meanwhile
          sleep 5 && docker exec worker node apps/worker/src/healthcheck.ts
          sleep 20 && docker exec worker node apps/worker/src/healthcheck.ts
          # license service: own database, migrates on start; issue a licence and activate it
          docker run --rm --network host -e PGPASSWORD=pokeshop postgres:16 \
            psql -h localhost -U pokeshop -d pokeshop -qc 'CREATE DATABASE pokeshop_license'
          LIC="-e LICENSE_DATABASE_URL=postgres://pokeshop:pokeshop@localhost:5432/pokeshop_license -e DATABASE_SSL=disable -e LICENSE_MASTER_KEY=$(openssl rand -base64 32) -e LICENSE_SHOP_TOKEN=$(openssl rand -hex 32)"
          docker run -d --name license --network host $LIC pokeshop:ci node apps/license/src/main.ts
          for i in $(seq 1 30); do curl -sf http://localhost:3100/health && break; sleep 2; done
          KEY=$(docker exec license node apps/license/src/cli.ts issue --email ci@example.com --note "CI smoke test" | grep -o 'CS-[0-9A-Z-]*' | head -1)
          test -n "$KEY"
          curl -sf -X POST http://localhost:3100/v1/activate -H 'content-type: application/json' \
            -d "{\"key\":\"$KEY\",\"device_id\":\"ci\",\"device_name\":\"CI\"}" | grep -q '"token"'
          echo "license service: issued and activated a licence"
      - name: Container logs
        if: always()
        run: |
          docker logs web 2>&1 | tail -80 || true
          docker logs worker 2>&1 | tail -40 || true
          docker logs license 2>&1 | tail -40 || true
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=staging,enable={{is_default_branch}}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
